name: Daily football report

on:
  workflow_dispatch:
    inputs:
      test_today:
        description: "Test: include today's already started/finished matches"
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub cron uses UTC. These two times cover 06:00 Europe/Warsaw
    # in summer and winter; app.py skips the inactive one.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run daily report
        env:
          FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LEAGUE_IDS: "4160026622,4212821298,3405541143,686337048,3614399544"
          SPORTMONKS_LEAGUE_IDS: "271,501"
          TIMEZONE: Europe/Warsaw
          RUN_AT_LOCAL_HOUR: "6"
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
          TEST_TODAY: ${{ inputs.test_today || false }}
          LOOKAHEAD_DAYS: "0"
          HISTORY_MATCHES: "10"
          H2H_MATCHES: "5"
          MIN_SAMPLE: "3"
          CORNERS_THRESHOLD: "10"
          GOALS_THRESHOLD: "2.5"
          MAX_MATCHES: "5"
        run: python3 app.py
